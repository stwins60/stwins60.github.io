# Pulls the latest profile content (about, services, experience, education,
# articles) from https://africantech.dev into _data/africantech.json and
# commits it when something changed. GitHub Pages then rebuilds the site.
name: Sync from africantech.dev

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-africantech
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the refreshed data file
      pages: write    # request a Pages rebuild after the commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch content
        run: node scripts/sync-africantech.mjs

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- _data/africantech.json; then
            echo "No changes from africantech.dev."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/africantech.json
          git commit -m "chore: sync content from africantech.dev"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't always kick off the Pages build,
      # so ask for one explicitly.
      - name: Request Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "::warning::Could not request a Pages build; it will build on the next push."
