<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}, home">
      <span class="brand-mark" aria-hidden="true">IF</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>

    <button class="icon-btn nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Menu">
      {% include icon.html name="menu" %}
    </button>

    <nav id="site-nav" class="site-nav" aria-label="Primary">
      <a href="{{ '/#about' | relative_url }}">About</a>
      <a href="{{ '/#experience' | relative_url }}">Experience</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.url == '/projects/' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/#writing' | relative_url }}">Writing</a>
      <a href="{{ '/resume/' | relative_url }}"{% if page.url == '/resume/' %} aria-current="page"{% endif %}>Résumé</a>
      <a class="btn btn-sm btn-primary" href="{{ '/#contact' | relative_url }}">Get in touch</a>
    </nav>

    <button class="icon-btn theme-toggle" type="button" aria-label="Toggle dark mode">
      <span class="when-dark">{% include icon.html name="sun" %}</span>
      <span class="when-light">{% include icon.html name="moon" %}</span>
    </button>
  </div>
</header>
