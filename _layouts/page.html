---
layout: default
---
<section class="page-hero">
  <div class="container">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {%- if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</section>
<div class="container page-body">
  {{ content }}
</div>
